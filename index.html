<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1f6feb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Расписание</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Общий лист записей</p>
        <h1>Расписание</h1>
      </div>
      <div class="status-wrap" aria-live="polite">
        <span id="netStatus" class="status-pill status-checking">Проверка связи…</span>
        <span id="syncStatus" class="status-pill status-idle">Синхронизация не настроена</span>
      </div>
    </header>

    <main class="layout">
      <section class="panel form-panel" aria-labelledby="formTitle">
        <div class="panel-head">
          <div>
            <p class="eyebrow">Новая запись</p>
            <h2 id="formTitle">Добавить в расписание</h2>
          </div>
          <button id="cancelEditBtn" class="ghost-btn hidden" type="button">Отменить редактирование</button>
        </div>

        <form id="entryForm" class="entry-form" novalidate>
          <input id="entryId" type="hidden">

          <label class="field field-wide">
            <span>Ваше имя</span>
            <input id="authorInput" name="author" type="text" autocomplete="name">
          </label>

          <label class="field">
            <span>Дата</span>
            <input id="dateInput" name="date" type="date" required>
          </label>

          <label class="field">
            <span>Время</span>
            <input id="timeInput" name="time" type="time" required>
          </label>

          <label class="field field-wide">
            <span>Информация</span>
            <textarea id="infoInput" name="info" rows="3" placeholder="Клиент, мероприятие, задача..." required></textarea>
          </label>

          <div class="field">
            <span>Тип</span>
            <div class="type-picker" role="radiogroup" aria-label="Тип записи">
              <label class="type-option">
                <input type="radio" name="type" value="training" checked>
                <span class="type-chip type-training">Тренировка</span>
              </label>
              <label class="type-option">
                <input type="radio" name="type" value="event">
                <span class="type-chip type-event">Мероприятие</span>
              </label>
              <label class="type-option">
                <input type="radio" name="type" value="task">
                <span class="type-chip type-task">Задача</span>
              </label>
              <label class="type-option">
                <input type="radio" name="type" value="photoshoot">
                <span class="type-chip type-photoshoot">Фотосессия</span>
              </label>
            </div>
          </div>

          <label class="field">
            <span>Цвет</span>
            <div class="color-row">
              <input id="colorInput" name="color" type="color" value="#1f6feb" aria-label="Цвет записи">
              <button id="resetColorBtn" class="ghost-btn" type="button">Цвет по типу</button>
            </div>
          </label>

          <div class="form-actions field-wide">
            <button id="saveBtn" class="primary-btn" type="submit">Сохранить запись</button>
            <p id="formHint" class="form-hint">Если интернета нет, запись сохранится на устройстве и отправится позже.</p>
          </div>
        </form>
      </section>

      <section class="panel schedule-panel" aria-labelledby="scheduleTitle">
        <div class="panel-head schedule-head">
          <div>
            <p class="eyebrow">Общий вид</p>
            <h2 id="scheduleTitle">Лента расписания</h2>
          </div>
          <div class="toolbar">
            <label class="search-field">
              <span class="sr-only">Поиск</span>
              <input id="searchInput" type="search" placeholder="Поиск по записи…">
            </label>
            <button id="syncBtn" class="ghost-btn" type="button">Синхронизировать</button>
          </div>
        </div>

        <div class="legend" aria-label="Легенда типов">
          <span class="legend-item"><i class="dot dot-training"></i>Тренировка</span>
          <span class="legend-item"><i class="dot dot-event"></i>Мероприятие</span>
          <span class="legend-item"><i class="dot dot-task"></i>Задача</span>
          <span class="legend-item"><i class="dot dot-photoshoot"></i>Фотосессия</span>
        </div>

        <div id="scheduleList" class="schedule-list" aria-live="polite"></div>
      </section>
    </main>
  </div>

  <template id="emptyTemplate">
    <div class="empty-state">
      <p class="empty-title">Пока записей нет</p>
      <p>Добавьте первую запись слева или сверху — она появится здесь.</p>
    </div>
  </template>

    <div id="actionDialog" class="dialog hidden" role="dialog" aria-modal="true" aria-labelledby="actionDialogTitle">
    <div class="dialog-card">
      <div class="dialog-head">
        <div><p class="eyebrow" id="actionDialogEyebrow">Действие</p><h3 id="actionDialogTitle">Действие</h3></div>
        <button id="actionDialogClose" class="icon-btn" type="button" aria-label="Закрыть">✕</button>
      </div>
      <p id="actionDialogDesc" class="dialog-desc"></p>
      <form id="actionDialogForm" class="dialog-form">
        <div id="actionScopeWrap" class="field hidden">
          <span>Область</span>
          <div class="scope-options">
            <label class="scope-option"><input type="radio" name="actionScope" value="single" checked><span>Только эта</span></label>
            <label class="scope-option"><input type="radio" name="actionScope" value="future"><span>Эта и следующие</span></label>
          </div>
        </div>
        <div id="actionDateWrap" class="dialog-grid hidden">
          <label class="field"><span>Дата</span><input id="actionDateInput" type="date"></label>
          <label class="field"><span>Время</span><input id="actionTimeInput" type="time"></label>
        </div>
        <div id="actionRepeatWrap" class="dialog-grid hidden">
          <label class="field"><span>Период</span>
            <select id="actionRepeatUnitInput">
              <option value="daily">День</option>
              <option value="weekly" selected>Неделя</option>
              <option value="monthly">Месяц</option>
            </select>
          </label>
          <label class="field"><span>Повторений</span><input id="actionRepeatInput" type="number" min="0" step="1" placeholder="Пусто = бесконечно"><small class="field-help">Пусто = бесконечно, +1 период в день записи.</small></label>
        </div>
        <div class="dialog-actions">
          <button id="actionDialogCancel" class="ghost-btn" type="button">Отмена</button>
          <button id="actionDialogSubmit" class="primary-btn" type="submit">Ок</button>
        </div>
      </form>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <script src="app.js?v=32" defer></script>
</body>
</html>
